<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Cookie Greeting</title>
    <style>
        /* Light CSS styling to make it look a bit nicer */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #greeting {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        #nameForm {
            margin-top: 20px;
        }

        input[name="username"] {
            padding: 5px;
            font-size: 1em;
        }

        button {
            padding: 5px 10px;
            font-size: 1em;
        }
    </style>
</head>

<body>
    <div id="greeting">Welcome!</div>
    <div id="visits">Visits: </div>

    <div id="nameForm">
        <p>Please enter your name:</p>
        <input type="text" id="nameInput" name="username" placeholder="Your name" />
        <button id="saveName">Save Name</button>
    </div>


    <script>
        function getCookie(name) {
            const cookies = document.cookie.split("; ");
            for (let c of cookies) {
                const [key, value] = c.split("=");
                if (key === name) return value;
            }
            return null;
        }


        // check if a username cookie already exists
        const savedName = getCookie('username');
        const greetingDiv = document.getElementById('greeting');
        const formDiv = document.getElementById('nameForm');

        if (savedName) {
            // if cookie found, greet the user and hide the form
            greetingDiv.textContent = "Welcome back, " + savedName + "!";
        }

        document.getElementById('saveName').addEventListener('click', () => {
            const nameValue = document.getElementById('nameInput').value;
            if (nameValue) {
                // set a cookie "username=<name>" that lasts 30 days and is available site wide
                const expiry = new Date();
                expiry.setTime(expiry.getTime() + 30 * 24 * 60 * 1000); // 30 days from now
                document.cookie = "username=" + encodeURIComponent(nameValue) + ";" +
                    "expires=" + expiry.toUTCString() + "; path=/";
            }

            // update the greeting
            greetingDiv.textContent = "hello, " + nameValue + "! Nice to meet you.";
        })


        let visits = getCookie("visits");

        if (visits) {
            visits = parseInt(visits) + 1;
            document.cookie = 'visits=' + encodeURIComponent(visits) + ';';
        } else {
            visits = 1;
        }

        document.getElementById("visits").textContent =
            "You have visited this site " + visits + " time(s)."
            ;

    </script>

</body>

</html>
